# The former Go release pipeline is archived under csharp/oracle/build/pipelines.
# Production publishing remains gated on signing and retained-target validation.
trigger: none
pr: none
pool:
  vmImage: windows-latest
steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '24.x'
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      version: '11.0.x'
      includePreviewVersions: true
  - script: npm ci
  - script: node csharp/tools/without-go.mjs node_modules/hereby/bin/hereby.js validate
  - script: node csharp/tools/without-go.mjs csharp/tools/package.mjs
  - script: node csharp/tools/verify-package.mjs
  - script: node csharp/tools/package-vsix.mjs
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: built/csharp/distribution/nativeaot
      artifact: csharp-validation
