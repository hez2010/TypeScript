name: C# Windows preview

on:
  workflow_dispatch:
    inputs:
      sdk-version:
        description: .NET 11 SDK version or channel to validate
        default: '11.0.x'
        type: string
  pull_request:
    paths: ['csharp/**', 'packages/typescript/**', 'packages/vscode-typescript/**', 'Herebyfile.mjs', '.github/workflows/csharp-windows.yml']

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: ${{ inputs.sdk-version || '11.0.x' }}
          dotnet-quality: daily
      - run: npm ci --no-audit --no-fund
      - uses: ./.github/actions/setup-go
      - name: Reproduce generated compiler tables and client artifacts
        run: node csharp/tools/verify-generators.mjs --go go
      - name: Release build and in-process safety checks
        run: |
          dotnet build csharp/TypeScript.slnx -c Release --artifacts-path built/csharp/build -p:UseSharedCompilation=false -p:RestoreLockedMode=true
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($test in @('--tracing-safety', '--typings-safety', '--lsp-safety', '--rpc-safety', '--project-safety')) {
            dotnet built/csharp/build/bin/TypeScript.Compatibility/release/TypeScript.Compatibility.dll $test
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          dotnet built/csharp/build/bin/TypeScript.Compatibility/release/TypeScript.Compatibility.dll --content-mappers $PWD
      - name: Install and exercise the CoreCLR validation packages
        run: npx hereby csharp:test-package
      - name: VS Code SDK resolution and actual language-client transport
        run: node csharp/tools/vscode-integration.mjs
      - name: Original extension typecheck and tests
        run: |
          npm run build --prefix packages/vscode-typescript
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test --prefix packages/vscode-typescript
      - name: Publish NativeAOT packages without executing them
        run: node csharp/tools/package.mjs
      - name: Verify NativeAOT package contents without executing them
        run: node csharp/tools/verify-package.mjs
      - name: Publish NativeAOT compatibility harness without executing it
        run: dotnet publish csharp/tests/TypeScript.Compatibility/TypeScript.Compatibility.csproj -c Release -r win-x64 -p:PublishAot=true -p:IlcInstructionSet=native -p:RestoreLockedMode=true -p:UseSharedCompilation=false --artifacts-path built/csharp/aot-harness -o built/csharp/aot-harness/publish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: csharp-win-x64-validation
          path: |
            built/csharp/distribution/*/manifest.json
            built/csharp/distribution/*/npm/*.tgz
            built/csharp/distribution/*/*.zip
            built/csharp/distribution/*/stage-*/publish.log
            built/csharp/distribution/*/stage-*/source-provenance.json
            built/csharp/phase8-validation/**/summary.json
            built/csharp/phase8-validation/**/*.log
            built/csharp/aot-harness/publish/**
